name: Publish My Diary web-only update

on:
  push:
    branches:
      - main
    paths:
      - "web-source/index.html"
      - "latest.json"

permissions:
  contents: write

concurrency:
  group: my-diary-web-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Diary update channel
        uses: actions/checkout@v4

      - name: Verify and publish HTML bundle without rebuilding APK
        shell: bash
        run: |
          set -euo pipefail
          test -s web-source/index.html
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = Path("web-source/index.html")
          data = source.read_bytes()
          if len(data) < 1000 or len(data) > 35 * 1024 * 1024:
              raise SystemExit("Diary web bundle size is outside the safe limit")
          text = data.decode("utf-8")
          if "<html" not in text.lower() and "<!doctype" not in text.lower():
              raise SystemExit("Diary web bundle is not an HTML document")
          meta_path = Path("latest.json")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          if meta.get("appName") != "My Diary" or meta.get("packageName") != "com.personal.diaryapp":
              raise SystemExit("Wrong app identity in update feed")
          # This feature changes the native JavaScript bridge. Do not expose its
          # web bundle to an older installed APK until the signed native release
          # is already present in the feed. The APK workflow's feed commit then
          # triggers this publisher again.
          if "ringDurationSeconds" in text or "ringVolumePercent" in text or "snoozeInterval:" in text or "saveMemoryImage" in text or "authenticateFingerprint" in text or "canUseFingerprint" in text or "scheduleReminderCustom" in text:
              app_version = (int(meta.get("versionCode", 0)), meta.get("versionName"))
              required_native = (193, "1.0.194") if "scheduleReminderCustom" in text else ((175, "1.0.176") if "authenticateFingerprint" in text else ((161, "1.0.162") if "saveMemoryImage" in text else (146, "1.0.147")))
              if app_version < required_native:
                  Path("/tmp/diary-web-publish-skipped").write_text("native release pending")
                  print("SKIP: native-dependent web bundle waits for its matching signed APK release")
                  raise SystemExit(0)
          mirror = Path("diary-web/index.html")
          actual_sha = hashlib.sha256(data).hexdigest()
          mirror_matches = mirror.is_file() and mirror.read_bytes() == data
          if mirror_matches and meta.get("webSha256", "").lower() == actual_sha:
              Path("/tmp/diary-web-publish-skipped").write_text("mirror and checksum already current")
              print("SKIP: published mirror and advertised checksum already match source")
              raise SystemExit(0)
          if mirror_matches:
              # Repair stale manifest metadata without incrementing the web version
              # or rewriting the already-correct published HTML mirror.
              meta["webSha256"] = actual_sha
              meta["webUrl"] = "https://raw.githubusercontent.com/amuazzinxyz-ops/My-Diary-Updates/main/web-source/index.html"
              meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Repaired stale web checksum for existing update", meta.get("webVersion"), "SHA-256", actual_sha)
          else:
              version = int(meta.get("webVersion", 0)) + 1
              Path("diary-web").mkdir(exist_ok=True)
              Path("diary-web/index.html").write_bytes(data)
              meta["webVersion"] = version
              meta["webUrl"] = "https://raw.githubusercontent.com/amuazzinxyz-ops/My-Diary-Updates/main/web-source/index.html"
              meta["webSha256"] = actual_sha
              meta["webReleaseNotes"] = "My Diary web bundle update. Existing saved data and app identity are preserved."
              meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print("Prepared web-only update", version, "SHA-256", actual_sha)
          PY
          if test -f /tmp/diary-web-publish-skipped; then exit 0; fi
          python3 -m json.tool latest.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary-web/index.html latest.json
          git commit -m "Publish My Diary web bundle update"
          git push origin HEAD:main
