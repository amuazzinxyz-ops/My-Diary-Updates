          if sound_service is None or sound_service.get(ns + "exported") != "false" or sound_service.get(ns + "foregroundServiceType") != "mediaPlayback":
              raise SystemExit("BLOCKED: timed ringtone foreground service manifest is missing or misconfigured")
          if "DiaryReminderSoundService.start(context, soundUri, ringDurationSeconds, ringVolumePercent)" not in kotlin or "ringDurationSeconds" not in kotlin or "ringVolumePercent" not in kotlin:
              raise SystemExit("BLOCKED: selected ringtone duration is not connected to native playback")
