          feed_version = (int(meta.get("versionCode", 0)), meta.get("versionName"))
          if feed_version not in ((215, "1.0.216"), (216, "1.0.217")):
              raise SystemExit(f"BLOCKED: update feed is neither the installed baseline nor the approved target release: {feed_version}")
