          if "setOf(2, 5, 10, 15, 20, 30)" not in kotlin or "setOf(10, 20, 30, 60, 120, 300)" not in kotlin or "SCREEN_BRIGHT_WAKE_LOCK" not in kotlin or "player.volume = volumePercent / 100f" not in kotlin:
              raise SystemExit("BLOCKED: approved Snooze and ringtone-duration choices are missing")
          wake_activities = [x for x in app.findall("activity") if x.get(ns + "name") == ".DiaryReminderWakeActivity"]
          if len(wake_activities) != 1 or wake_activities[0].get(ns + "exported") != "false" or wake_activities[0].get(ns + "excludeFromRecents") != "true":
              raise SystemExit("BLOCKED: wake-only activity manifest configuration is invalid")
          if kotlin.count(".setContentIntent(content)") != 1:
              raise SystemExit("BLOCKED: expected exactly one standard reminder notification tap action")
          for required in ("RingtoneManager.ACTION_RINGTONE_PICKER", "Intent.ACTION_OPEN_DOCUMENT", "setSound(null, alarmAttributes)", "diary_reminder_sound_uri", "diary_reminder_snooze_minutes", "diary_reminder_snooze_limit", "diary_reminder_ring_duration_seconds", "diary_reminder_ring_volume_percent", "ringDurationSeconds", "ringVolumePercent", "snoozeUsed", 'put("soundUri", soundUri)', 'put("snoozeMinutes", snoozeMinutes)', 'put("snoozeLimit", snoozeLimit)'):
              if required not in kotlin:
