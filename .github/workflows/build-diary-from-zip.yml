          for required in ("const val ACTION_AUTO_SNOOZE", "AUTO_ITEMS = \"auto_items\"", "fun scheduleAutoSnooze(", "fun cancelAutoSnooze(", "fun readAutoItems(", "val autoItems = readAutoItems(context)", "DiaryReminderScheduler.scheduleAutoSnooze(", "DiaryReminderScheduler.ACTION_AUTO_SNOOZE ->", "DiaryReminderScheduler.cancelAutoSnooze(context, id)"):
              if required not in kotlin:
