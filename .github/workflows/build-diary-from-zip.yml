          recovery_end=html.find("\n }", recovery_start)
          recovery=html[recovery_start:recovery_end if recovery_end!=-1 else recovery_start+1000]
          if recovery_start<0 or "localStorage.removeItem(DIARY_MASTER_PATTERN_KEY)" in recovery or "localStorage.setItem(DIARY_MASTER_PIN_KEY,pin)" not in recovery:
              raise SystemExit("BLOCKED: Forgot PIN recovery must replace only the PIN and preserve the saved Pattern")
          for required in ("function diaryRecoveryPending()", "function diaryHasFavouriteName()", "function saveDiaryFavouriteName(value)", "function verifyDiaryFavouriteName(value)", "DIARY_RECOVERY_NAME_SALT_KEY", "DIARY_RECOVERY_NAME_HASH_KEY", "if(diaryRecoveryPending())", "favouriteNameWrong", "localStorage.setItem('diaryDiaryMustChooseNewPinAfterRecovery','1')"):
