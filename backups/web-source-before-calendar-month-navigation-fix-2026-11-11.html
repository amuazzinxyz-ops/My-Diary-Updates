 function compressDiaryPhoto(file){
  return new Promise(function(resolve,reject){
   if(!file||file.size>12*1024*1024){reject(new Error('too large'));return;}
   var url=URL.createObjectURL(file),img=new Image();
   img.onload=function(){try{var max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));var ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);var data=c.toDataURL('image/jpeg',.76);URL.revokeObjectURL(url);if(data.length>1400000){reject(new Error('compressed photo too large'));return;}resolve(data);}catch(err){URL.revokeObjectURL(url);reject(err);}};
   img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('image read failed'));};img.src=url;
  });
 }
